name: Deploy Frontend to GitHub Pages

# Trigger deployment fix

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          allow_empty_commit: true

      - name: Ensure GitHub Pages source is enabled
        run: |
          gh api repos/${{ github.repository }}/pages -X PUT -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -f "source[branch]=gh-pages" -f "source[path]=/"
